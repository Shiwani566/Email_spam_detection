<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spam Detection Results</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page">

        <div class="hero">

            <div class="icon">
                📬
            </div>

            <h1>Email Results</h1>

            <p>
                Latest emails analyzed by the ML model
            </p>

        </div>


        <div class="results-container">

            {% for email in emails %}

            <div class="email-card">

                <div class="email-header">

                    <span>
                        📩 Email {{ loop.index }}
                    </span>

                    {% if email.result == "SPAM" %}

                    <span class="badge spam">
                        🔴 SPAM
                    </span>

                    {% else %}

                    <span class="badge safe">
                        🟢 NOT SPAM
                    </span>

                    {% endif %}

                </div>


                <div class="email-content">

                    <h3>
                        {{ email.subject }}
                    </h3>

                    <p>
                        {{ email.body }}
                    </p>

                </div>

            </div>

            {% endfor %}

        </div>


        <a href="/" class="back-link">

            <button type="button">
                ← Check More Emails
            </button>

        </a>

    </div>

</body>

</html>
