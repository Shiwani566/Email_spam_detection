<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Spam Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="page">

        <div class="hero">

            <div class="icon">
                📧
            </div>

            <h1>Email Spam Detector</h1>

            <p>
                Detect spam emails using Machine Learning
            </p>

        </div>


        <div class="card">

            <form id="emailForm" action="/check-gmail" method="POST">

                <label for="email_address">
                    Gmail Address
                </label>

                <input
                    type="email"
                    id="email_address"
                    name="email_address"
                    placeholder="example@gmail.com"
                    required
                >


       <label for="app_password">
    Gmail App Password
</label>

<div class="password-box">

    <input
        type="password"
        id="app_password"
        name="app_password"
        placeholder="Enter your App Password"
        required
    >

    <button
        type="button"
        id="togglePassword"
        class="password-toggle"
    >
        👁️
    </button>

</div>


                <label for="email_count">
                    Number of emails to check
                </label>

                <select
                    id="email_count"
                    name="email_count"
                >

                    <option value="5">
                        Latest 5 Emails
                    </option>

                    <option value="10">
                        Latest 10 Emails
                    </option>

                    <option value="15">
                        Latest 15 Emails
                    </option>

                    <option value="20">
                        Latest 20 Emails
                    </option>

                </select>


               <button
    type="submit"
    id="checkButton"
>
    🔍 Check Emails
</button>

            </form>


            <p class="security-note">

                🔒 Your App Password is used only
                for this check and is not stored.

            </p>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
